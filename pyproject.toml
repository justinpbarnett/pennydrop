[project]
name = "pennydrop"
version = "0.1.0"
description = "Server core for Pennydrop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "python-dotenv",
    "sympy",
    "numpy",
    "soundfile",
    "kokoro",
    "python-multipart",
    "en-core-web-sm",
    "mlx-audio>=0.6.7",
    "num2words>=0.5.14",
    "pillow>=13.0.0",
]

[dependency-groups]
fonts = ["fonttools", "brotli", "skia-pathops"]

[project.scripts]
pd = "pennydrop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/pennydrop"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
