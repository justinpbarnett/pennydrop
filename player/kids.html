<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Pennydrop</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pennydrop" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#FFF4DA" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/kids/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/kids/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/kids/icon.svg" />
  </head>
  <body class="kids">
    <div id="kids">
      <main class="kstage-area">
        <div class="kstage-frame">
          <svg id="stage" aria-hidden="true"></svg>
          <div id="face" class="face-layer"></div>
        </div>
      </main>
      <nav class="dock">
        <button id="why" class="why" type="button" aria-label="Why?"></button>
        <button id="mic" class="mic" type="button" aria-label="Ask with your voice" aria-pressed="false"></button>
        <button id="play" class="play" type="button" aria-label="Play or pause"></button>
      </nav>
      <div id="avatars" class="avatars" hidden></div>
    </div>
    <script type="module" src="/src/kids/main.ts"></script>
  </body>
</html>
